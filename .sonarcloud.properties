# Configuração do SonarQube Cloud (Automatic Analysis) — phati.
#
# O nome do arquivo importa: a Automatic Analysis lê `.sonarcloud.properties` e
# ignora `sonar-project.properties` (doc do SonarQube Cloud). Não há workflow
# chamando o scanner; a análise vem pela integração do GitHub App.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# Só código é analisado. Documentação, specs, governança e config do agente ficam
# de fora, como no CodeRabbit (`.coderabbit.yaml`) e no Codex (AGENTS.md).
sonar.exclusions=**/*.md,docs/**,specs/**,sessoes/**,.specify/**,.claude/**,.agents/**

# Duplicação: contar texto de governança como código duplicado polui a métrica.
sonar.cpd.exclusions=**/*.md,docs/**,specs/**,sessoes/**,.specify/**,.claude/**,.agents/**
