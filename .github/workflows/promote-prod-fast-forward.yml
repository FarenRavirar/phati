name: promote-prod-fast-forward

# Promoção canônica dev -> main preservando a invariante main ⊆ dev (AGENTS.md §Git).
# Não cria commit de merge nem de squash: main avança por fast-forward até dev.
# Promover não é publicar: este workflow só move o ponteiro Git, não builda nem faz deploy.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PROMOTE_DEV_TO_MAIN para promover dev -> main"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fast-forward:
    name: Fast-forward main to dev
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Exceção consciente ao artipacked (zizmor): este job faz `git push origin
          # refs/remotes/origin/dev:refs/heads/main`, que exige o GITHUB_TOKEN persistido
          # no git-config. NÃO trocar para false: quebraria a promoção dev -> main em silêncio.
          persist-credentials: true
          fetch-depth: 0

      - name: Validar confirmação e invariante
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "PROMOTE_DEV_TO_MAIN" ]; then
            echo "ERRO: confirm precisa ser PROMOTE_DEV_TO_MAIN"
            exit 1
          fi

          git fetch --no-tags --prune origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev
          bash scripts/validar-invariante-branches.sh origin/main origin/dev

      - name: Promover main por fast-forward
        run: |
          set -euo pipefail
          git push origin refs/remotes/origin/dev:refs/heads/main
          echo "ref_promovida=$(git rev-parse --short origin/dev)"
