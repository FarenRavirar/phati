name: promote-dev-to-main

# PR permanente: todo push em dev cria ou atualiza a PR de revisão da promoção.
# ATENÇÃO: não usar squash nem merge commit nesta PR, pois isso quebra main ⊆ dev.
# Promoção segura = workflow promote-prod-fast-forward.yml ou "Rebase and merge".
on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  promotion-pr:
    name: Promotion PR dev -> main
    runs-on: ubuntu-24.04
    steps:
      - name: Criar ou atualizar a PR permanente
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          number=$(gh pr list \
            --base main \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          title="Revisar promoção dev para main"
          body=$(cat <<'EOF'
          PR permanente e automática para revisar o que será promovido de `dev` para `main`.

          **Regra crítica:** `main` deve continuar ancestral de `dev` (`main ⊆ dev`).

          Não use "Squash and merge" nem "Create a merge commit": ambos criam em `main` um commit que não existe em `dev` e quebram o guard.

          Promoção aprovada:
          1. Preferido: rodar o workflow `promote-prod-fast-forward.yml` com a confirmação `PROMOTE_DEV_TO_MAIN`.
          2. Alternativa manual: usar somente "Rebase and merge" no GitHub.

          Depois da promoção, `main` deve apontar para o mesmo commit de `dev` ou para um commit contido em `dev`.
          Promover não é publicar: o deploy é uma etapa à parte.
          EOF
          )

          if [ -n "$number" ]; then
            if gh pr edit "$number" --title "$title" --body "$body"; then
              echo "pr_promocao=$number"
            else
              echo "::warning::O GitHub Actions não pode editar PRs neste repositório. PR permanente existente: #$number."
            fi
          elif gh pr create --base main --head dev --title "$title" --body "$body"; then
            echo "pr_promocao=criada"
          else
            echo "::warning::O GitHub Actions não pode criar a PR permanente neste repositório. Crie ou atualize a PR dev -> main manualmente."
          fi
