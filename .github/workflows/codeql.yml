name: codeql

# CodeQL (SAST nativo do GitHub), grátis em repositório público. Resultados em Security -> Code scanning.
# Sem segredo e sem serviço externo. Linguagens do phati:
# python (servidor/), javascript-typescript (hooks do git e scripts) e actions (os próprios workflows).
on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "27 4 * * 1" # semanal, segunda 04:27 UTC
  workflow_dispatch: # a promoção dev -> main dispara aqui: push com GITHUB_TOKEN não inicia workflows

permissions:
  contents: read

jobs:
  analisar:
    name: Analisar (${{ matrix.linguagem }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        linguagem:
          - python
          - javascript-typescript
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inicializar o CodeQL
        # Terceiro fixado por SHA; a troca de versão vem pelo Dependabot (SHA e comentário juntos).
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none

      - name: Executar a análise do CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.linguagem }}"
