{% comment %}EnvioArquivo (formularios/EnvioArquivo.jsx). Parâmetros: titulo (padrão "Arraste o arquivo ou clique para escolher"), ajuda, aceita (atributo accept), id e nome do input de arquivo. A zona é um <label> ligado ao input de arquivo: clique e teclado (Tab, Enter/Espaço) são do navegador. Precisa de agrion-componentes.js só para arrastar e soltar. Chamar com `only`.{% endcomment %}<label class="ag-envio"><span class="ag-envio-icone">{% icone "upload" tamanho=20 %}</span><span class="ag-envio-titulo">{% if titulo is not None %}{{ titulo }}{% else %}Arraste o arquivo ou clique para escolher{% endif %}</span>{% if ajuda %}<span class="ag-ajuda">{{ ajuda }}</span>{% endif %}<input type="file" class="so-leitor"{% if id %} id="{{ id }}"{% endif %}{% if nome %} name="{{ nome }}"{% endif %}{% if aceita %} accept="{{ aceita }}"{% endif %}></label>
