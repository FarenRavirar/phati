{% comment %}Segmentado (formularios/Segmentado.jsx). Parâmetros: opcoes [{valor, rotulo, icone}], valor (opção ativa), rotulo (aria-label do grupo). A troca de opção é JS do consumidor (sem JS os botões só mostram o estado). Chamar com `only`.{% endcomment %}<div class="ag-segmentado" role="group"{% if rotulo %} aria-label="{{ rotulo }}"{% endif %}>{% for o in opcoes %}<button type="button" aria-pressed="{% if o.valor == valor %}true{% else %}false{% endif %}" data-valor="{{ o.valor }}">{% if o.icone %}{% icone o.icone tamanho=14 %}{% endif %}{{ o.rotulo }}</button>{% endfor %}</div>
