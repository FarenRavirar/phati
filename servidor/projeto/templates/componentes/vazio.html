{% comment %}Parâmetros: texto; acao_rotulo e acao_destino (opcionais, a view só os passa se a permissão efetiva permite). Estado vazio legítimo: nunca preencher com número inventado.{% endcomment %}<div class="vazio"><p class="vazio-texto">{{ texto }}</p>{% if acao_rotulo and acao_destino %}<p class="vazio-acao"><a class="botao" href="{{ acao_destino }}">{{ acao_rotulo }}</a></p>{% endif %}</div>
