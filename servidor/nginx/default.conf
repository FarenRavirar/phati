# Estáticos pelo nginx e o resto para o gunicorn (D070): o mesmo caminho do deploy, para o CSP e as páginas de erro serem os reais.

# Limite de taxa por origem nas rotas públicas (T5.5d, prática 9 do AGENTS.md): segura inundação de CPU (Argon2) e de
# e-mail. A trava por conta (R2) é a que segura força bruta. Chave vazia não conta (doc do nginx), então só estas rotas
# entram na zona; estáticos e o resto passam livres.
# shortcut: a chave é o `remote_addr` do próprio nginx; atrás de túnel ou balanceador todos dividem um balde, e a
# origem real precisa vir de `real_ip_header` com `set_real_ip_from` do proxy confiável, a definir no deploy (T6.5).
map $uri $chave_rotas_publicas {
    ~^/(entrar|esqueci-senha)$ $binary_remote_addr;
    ~^/api/v1/(entrar|redefinir-senha/(solicitar|confirmar)|acesso/renovar)$ $binary_remote_addr;
    default "";
}
limit_req_zone $chave_rotas_publicas zone=rotas_publicas:1m rate=5r/s;

server {
    listen 8080;
    server_tokens off;

    location /static/ {
        alias /estaticos/;
    }

    location / {
        limit_req zone=rotas_publicas burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
