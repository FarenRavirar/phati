# Estáticos pelo nginx e o resto para o gunicorn (D070): o mesmo caminho do deploy, para o CSP e as páginas de erro serem os reais.
server {
    listen 8080;
    server_tokens off;

    location /static/ {
        alias /estaticos/;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
