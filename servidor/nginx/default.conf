# Estáticos pelo nginx e o resto para o gunicorn (D070): o mesmo caminho do deploy, para o CSP e as páginas de erro serem os reais.

# Limite de taxa por origem nas rotas públicas (T5.5d, prática 9 do AGENTS.md): segura inundação de CPU (Argon2) e de
# e-mail. A trava por conta (R2) é a que segura força bruta. Só POST conta (GET das páginas de formulário não gasta a
# cota) e chave vazia não conta (doc do nginx), então só estas rotas entram na zona; estáticos e o resto passam livres.
# `/painel/login/` entra porque o painel autentica pelo mesmo `login.autenticar` (Argon2 até para CPF inexistente).
# shortcut: a chave é o `remote_addr` do próprio nginx; atrás de túnel ou balanceador todos dividem um balde, e a
# origem real precisa de `real_ip_header` com `set_real_ip_from` do proxy confiável, a definir no deploy (T6.5).
map "$request_method $uri" $chave_rotas_publicas {
    "~^POST /(entrar|esqueci-senha|painel/login/)$" $binary_remote_addr;
    "~^POST /api/v1/(entrar|redefinir-senha/(solicitar|confirmar)|acesso/renovar)$" $binary_remote_addr;
    default "";
}
limit_req_zone $chave_rotas_publicas zone=rotas_publicas:1m rate=5r/s;

server {
    listen 8080;
    server_tokens off;
    limit_req_status 429;

    location /static/ {
        alias /estaticos/;
    }

    # A API responde o mesmo envelope `{"detalhe": ...}` do Django; a página, texto em português.
    location /api/ {
        limit_req zone=rotas_publicas burst=20 nodelay;
        error_page 429 @taxa_api;
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        limit_req zone=rotas_publicas burst=20 nodelay;
        error_page 429 @taxa_pagina;
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @taxa_api {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"detalhe": "muitas_requisicoes"}';
    }

    location @taxa_pagina {
        default_type "text/html; charset=utf-8";
        add_header Retry-After 1 always;
        return 429 '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Muitas tentativas · phati</title><p>Muitas tentativas em pouco tempo. Espere alguns segundos e tente de novo.</p></html>';
    }
}
