; Modelo do PgBouncer (spec 009 R18). O entrypoint.sh copia para <raiz>/<instância>/pgbouncer.ini e troca @BANCO@ e @DIR@.
; O segredo do papel do app não entra aqui: o auth_file traz só o verificador SCRAM (gravado pelo passo `auth`).
[databases]
@BANCO@ = host=banco port=5432 dbname=@BANCO@

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /cfg/userlist.txt
; transaction + max_prepared_statements > 0: o psycopg 3 usa prepared statements (medido, plan.md §Banco sem parada).
pool_mode = transaction
max_prepared_statements = 200
max_client_conn = 200
default_pool_size = 20
; Dois processos na mesma porta: o kernel reparte as conexões novas (so_reuseport, plan.md §PgBouncer: scram e queda).
so_reuseport = 1
unix_socket_dir = @DIR@
pidfile = @DIR@/pgb.pid
logfile = @DIR@/pgb.log
