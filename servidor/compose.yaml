# Dev e testes: sobe o mesmo par da produção (app + banco). Variáveis vêm do ambiente ou de um .env
# fora do repositório (nomes em .env.exemplo); sem elas o compose recusa subir.
# O serviço `app` recebe só as credenciais do papel `app`; as do papel `dono` ficam só em `migracao`.
x-ambiente-app: &ambiente_app
  PHATI_CHAVE_SECRETA: ${PHATI_CHAVE_SECRETA:?}
  PHATI_DEPURACAO: ${PHATI_DEPURACAO:-0}
  PHATI_HOSTS_PERMITIDOS: ${PHATI_HOSTS_PERMITIDOS:-localhost,127.0.0.1}
  PHATI_BANCO_NOME: ${PHATI_BANCO_NOME:-phati}
  PHATI_BANCO_HOST: banco
  PHATI_BANCO_PORTA: "5432"
  PHATI_BANCO_APP_USUARIO: ${PHATI_BANCO_APP_USUARIO:?}
  PHATI_BANCO_APP_SENHA: ${PHATI_BANCO_APP_SENHA:?}
  PHATI_CHAVE_CPF: ${PHATI_CHAVE_CPF:?}
  PHATI_SEGREDO_RLS: ${PHATI_SEGREDO_RLS:?}
  PHATI_URL_BASE: ${PHATI_URL_BASE:-http://localhost:8000}
  PHATI_EMAIL_HOST: ${PHATI_EMAIL_HOST:-localhost}
  PHATI_EMAIL_PORTA: ${PHATI_EMAIL_PORTA:-587}
  PHATI_EMAIL_USUARIO: ${PHATI_EMAIL_USUARIO:-}
  PHATI_EMAIL_SENHA: ${PHATI_EMAIL_SENHA:-}
  PHATI_EMAIL_PRAZO: ${PHATI_EMAIL_PRAZO:-10}
  PHATI_EMAIL_REMETENTE: ${PHATI_EMAIL_REMETENTE:-phati@localhost}
  PHATI_IMPLANTACAO: ${PHATI_IMPLANTACAO:-0}
  PHATI_AMBIENTE: ${PHATI_AMBIENTE:-producao}
  PHATI_MAPA_TESTE_ATIVO: ${PHATI_MAPA_TESTE_ATIVO:-0}
  PHATI_MAPA_FUNDO_GOOGLE_ATIVO: ${PHATI_MAPA_FUNDO_GOOGLE_ATIVO:-0}
  PHATI_MAPA_GOOGLE_CHAVE: ${PHATI_MAPA_GOOGLE_CHAVE:-}
  PHATI_PACOTES_DIR: ${PHATI_PACOTES_DIR:-/pacotes}
  PHATI_PMTILES_BIN: ${PHATI_PMTILES_BIN:-pmtiles}
  PHATI_RIO_BIN: ${PHATI_RIO_BIN:-rio}

services:
  banco:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81 # PostgreSQL 18
    environment:
      POSTGRES_PASSWORD: ${PHATI_BANCO_SUPER_SENHA:?}
      PHATI_BANCO_NOME: ${PHATI_BANCO_NOME:-phati}
      PHATI_BANCO_DONO_USUARIO: ${PHATI_BANCO_DONO_USUARIO:?}
      PHATI_BANCO_DONO_SENHA: ${PHATI_BANCO_DONO_SENHA:?}
      PHATI_BANCO_APP_USUARIO: ${PHATI_BANCO_APP_USUARIO:?}
      PHATI_BANCO_APP_SENHA: ${PHATI_BANCO_APP_SENHA:?}
    volumes:
      - dados_banco:/var/lib/postgresql  # PG18+: o PGDATA fica em /var/lib/postgresql/18/docker
      - ./banco/papeis.sql:/papeis.sql:ro
      - ./banco/inicializar-papeis.sh:/docker-entrypoint-initdb.d/inicializar-papeis.sh:ro
    healthcheck:
      # -h 127.0.0.1: na criação do volume a imagem sobe um servidor temporário só em socket; sem -h ele pareceria pronto.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d $$PHATI_BANCO_NOME"]
      interval: 5s
      retries: 10

  migracao:
    build: .
    # O `check` acusa PHATI_SEGREDO_RLS diferente do gravado no banco; falhando, o `app` não sobe (depends_on).
    command: sh -c "python manage.py migrate && python manage.py check --database default"
    environment:
      <<: *ambiente_app
      PHATI_BANCO_DONO_USUARIO: ${PHATI_BANCO_DONO_USUARIO:?}
      PHATI_BANCO_DONO_SENHA: ${PHATI_BANCO_DONO_SENHA:?}
    volumes:
      - pacotes:${PHATI_PACOTES_DIR:-/pacotes}  # `popular_sintetico` instala o pacote de referência no ambiente de teste de navegador (004b T2.1a)
    depends_on:
      banco: {condition: service_healthy}

  # Publica os estáticos no volume que o nginx serve. Roda como root só para escrever no volume recém-criado.
  estaticos:
    build: .
    user: "0"
    command: python manage.py collectstatic --noinput
    environment:
      <<: *ambiente_app
      PHATI_ESTATICOS: /estaticos
    volumes:
      - estaticos:/estaticos

  nginx:
    image: nginx:1.31-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - estaticos:/estaticos:ro
    depends_on:
      app: {condition: service_healthy}
      estaticos: {condition: service_completed_successfully}

  # Acerta o dono do volume dos pacotes no caminho configurado: volume novo nasce de root, e só `/pacotes` é preparado na imagem.
  # Roda como root uma vez; só muda o dono (nada é apagado nem recriado). 10001 = `aplicacao` (Dockerfile).
  pacotes_dono:
    build: .
    user: "0"
    command: chown 10001 ${PHATI_PACOTES_DIR:-/pacotes}
    volumes:
      - pacotes:${PHATI_PACOTES_DIR:-/pacotes}

  app:
    build: .
    environment: *ambiente_app
    volumes:
      - pacotes:${PHATI_PACOTES_DIR:-/pacotes}  # versões do pacote offline (004b); sem volume sumiriam a cada recriação do contêiner
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migracao: {condition: service_completed_successfully}
      pacotes_dono: {condition: service_completed_successfully}

volumes:
  dados_banco:
  estaticos:
  pacotes:
