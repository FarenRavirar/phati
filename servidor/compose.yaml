# Dev e testes: sobe o mesmo par da produção (app + banco). Variáveis vêm do ambiente ou de um .env
# fora do repositório (nomes em .env.exemplo); sem elas o compose recusa subir.
# O serviço `app` recebe só as credenciais do papel `app`; as do papel `dono` ficam só em `migracao`.
x-ambiente-app: &ambiente_app
  PHATI_CHAVE_SECRETA: ${PHATI_CHAVE_SECRETA:?}
  PHATI_DEPURACAO: ${PHATI_DEPURACAO:-0}
  PHATI_HOSTS_PERMITIDOS: ${PHATI_HOSTS_PERMITIDOS:-localhost,127.0.0.1}
  PHATI_BANCO_NOME: ${PHATI_BANCO_NOME:-phati}
  PHATI_BANCO_HOST: banco
  PHATI_BANCO_PORTA: "5432"
  PHATI_BANCO_APP_USUARIO: ${PHATI_BANCO_APP_USUARIO:?}
  PHATI_BANCO_APP_SENHA: ${PHATI_BANCO_APP_SENHA:?}
  PHATI_CHAVE_CPF: ${PHATI_CHAVE_CPF:?}
  PHATI_SEGREDO_RLS: ${PHATI_SEGREDO_RLS:?}
  PHATI_URL_BASE: ${PHATI_URL_BASE:-http://localhost:8000}
  PHATI_EMAIL_HOST: ${PHATI_EMAIL_HOST:-localhost}
  PHATI_EMAIL_PORTA: ${PHATI_EMAIL_PORTA:-587}
  PHATI_EMAIL_USUARIO: ${PHATI_EMAIL_USUARIO:-}
  PHATI_EMAIL_SENHA: ${PHATI_EMAIL_SENHA:-}
  PHATI_EMAIL_REMETENTE: ${PHATI_EMAIL_REMETENTE:-phati@localhost}

services:
  banco:
    image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe # PostgreSQL 17.11
    environment:
      POSTGRES_PASSWORD: ${PHATI_BANCO_SUPER_SENHA:?}
      PHATI_BANCO_NOME: ${PHATI_BANCO_NOME:-phati}
      PHATI_BANCO_DONO_USUARIO: ${PHATI_BANCO_DONO_USUARIO:?}
      PHATI_BANCO_DONO_SENHA: ${PHATI_BANCO_DONO_SENHA:?}
      PHATI_BANCO_APP_USUARIO: ${PHATI_BANCO_APP_USUARIO:?}
      PHATI_BANCO_APP_SENHA: ${PHATI_BANCO_APP_SENHA:?}
    volumes:
      - dados_banco:/var/lib/postgresql/data
      - ./banco/papeis.sql:/papeis.sql:ro
      - ./banco/inicializar-papeis.sh:/docker-entrypoint-initdb.d/inicializar-papeis.sh:ro
    healthcheck:
      # -h 127.0.0.1: na criação do volume a imagem sobe um servidor temporário só em socket; sem -h ele pareceria pronto.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d $$PHATI_BANCO_NOME"]
      interval: 5s
      retries: 10

  migracao:
    build: .
    command: python manage.py migrate
    environment:
      <<: *ambiente_app
      PHATI_BANCO_DONO_USUARIO: ${PHATI_BANCO_DONO_USUARIO:?}
      PHATI_BANCO_DONO_SENHA: ${PHATI_BANCO_DONO_SENHA:?}
    depends_on:
      banco: {condition: service_healthy}

  app:
    build: .
    environment: *ambiente_app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migracao: {condition: service_completed_successfully}

volumes:
  dados_banco:
